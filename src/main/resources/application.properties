spring.application.name=neo4j
server.port=8081

# Credentials are read from environment variables - never commit real values here.
spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USERNAME}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
spring.data.neo4j.database=${NEO4J_DATABASE}

# JWT signing key (at least 32 characters) and token lifetime.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=60

# First admin account, created only when the database has no users yet.
app.bootstrap.admin-username=${ADMIN_USERNAME:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# Comma-separated list of frontend origins allowed to call the API.
app.cors.allowed-origins=http://localhost:4200

# Email notifications (optional). Configure the mail server with SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD. Without a mail server, emails are only logged.
app.notifications.from=${NOTIFY_FROM:no-reply@worksphere.local}
# Shared HR mailbox that receives new and withdrawn staffing requests.
app.notifications.hr-email=${NOTIFY_HR_EMAIL:}
# Frontend address used for links in emails, e.g. https://worksphere.example.com
app.notifications.base-url=${APP_BASE_URL:}
